tasks:
  - name: jpeg-xl-balanced
    command: >
      sh ./transcode-jpeg.sh
      "{{.src_folder}}/{{.name}}.{{.extension}}"
      "{{.dst_folder}}/{{.name}}.jxl"
    extensions:
      - jpeg
      - jpg

  - name: jpeg-xl-lossless-pixels
    command: >
      cjxl -d 0
      "{{.src_folder}}/{{.name}}.{{.extension}}"
      "{{.dst_folder}}/{{.name}}.jxl"
    extensions:
      - exr
      - pam
      - pfm
      - pgm
      - pgx
      - pnm
      - png
      - ppm

  - name: caesium-lossless
    command: >
      caesiumclt --lossless --keep-dates --exif
      -o "{{.dst_folder}}"
      "{{.src_folder}}/{{.name}}.{{.extension}}"
    extensions:
      - webp

  - name: passthrough-images
    command: ""
    extensions:
      - avif
      - bmp
      - dng
      - gif
      - heic
      - heif
      - insp
      - jxl
      - psd
      - raw
      - rw2
      - svg
      - tif
      - tiff
